name: QueLess showcase demo tests

on:
  push:
    branches:
      - main
      - feature/simple-showcase-staff-20261117
  pull_request:
    paths:
      - "queless-webapp/**"
      - "Dockerfile"
      - ".github/workflows/queless-dashboard-ci.yml"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: queless-webapp/pom.xml

      - name: Compile and package
        run: mvn -B -f queless-webapp/pom.xml clean package

      - name: Build Render-compatible container
        run: docker build -t queless-demo-test .

      - name: Start app with no staff password
        run: docker run -d --name queless-ci -p 8080:8080 queless-demo-test

      - name: Verify patient and staff showcase
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:8080/ -o /tmp/home.html; then break; fi
            sleep 2
          done
          grep -q "I'm a patient" /tmp/home.html
          grep -q "I'm clinic staff" /tmp/home.html
          grep -q 'href="/dashboard"' /tmp/home.html

          # Staff portal opens the exact dashboard without a password.
          curl -fsS -b /tmp/staff.cookie -c /tmp/staff.cookie http://localhost:8080/dashboard -o /tmp/staff.html
          grep -q 'QueLess Business Dashboard' /tmp/staff.html
          grep -q 'href="/joinqueue"' /tmp/staff.html
          grep -q 'Staff Dashboard' /tmp/staff.html
          grep -q 'Customer Dashboard' /tmp/staff.html
          grep -q 'Live queue monitor' /tmp/staff.html
          grep -q 'Analytics' /tmp/staff.html
          grep -q 'Active queues' /tmp/staff.html
          grep -q 'Load demo patients' /tmp/staff.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/staff/login)" = "302"

          STAFF_CSRF="$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/staff.html | head -n1)"
          test -n "$STAFF_CSRF"

          # Add sample people to General Consultation with one click.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/staff.cookie \
            --data-urlencode "_csrf=$STAFF_CSRF" -d 'queueId=1' \
            http://localhost:8080/demo/load)" = "302"
          curl -fsS -b /tmp/staff.cookie 'http://localhost:8080/dashboard?queueId=1' -o /tmp/samples.html
          grep -q 'T. Kgosi' /tmp/samples.html
          grep -q 'B. Mmusi' /tmp/samples.html
          grep -q 'Serving' /tmp/samples.html

          # Existing patient view works from a completely different browser session.
          curl -fsS -b /tmp/patient.cookie -c /tmp/patient.cookie http://localhost:8080/joinqueue -o /tmp/join.html
          grep -q 'Pharmacy' /tmp/join.html
          grep -q 'href="/dashboard"' /tmp/join.html
          grep -q 'Customer Dashboard' /tmp/join.html
          grep -q 'Staff Dashboard' /tmp/join.html
          PATIENT_CSRF="$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/join.html | head -n1)"
          test -n "$PATIENT_CSRF"
          TRACKING_URL="$(curl -s -o /dev/null -w '%{redirect_url}' -b /tmp/patient.cookie -c /tmp/patient.cookie \
            -d 'queueId=2' --data-urlencode 'userName=Demo Visitor' \
            --data-urlencode "_csrf=$PATIENT_CSRF" http://localhost:8080/joinqueue)"
          [[ "$TRACKING_URL" == *"/status?ticket="* ]]
          curl -fsS -b /tmp/patient.cookie "$TRACKING_URL" -o /tmp/ticket.html
          grep -q 'Demo Visitor' /tmp/ticket.html

          curl -fsS -b /tmp/staff.cookie 'http://localhost:8080/dashboard?queueId=2' -o /tmp/pharmacy.html
          grep -q 'Demo Visitor' /tmp/pharmacy.html

          # Call next updates patient-facing screen.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/staff.cookie \
            -d 'queueId=2' --data-urlencode "_csrf=$STAFF_CSRF" http://localhost:8080/callnext)" = "302"
          curl -fsS -b /tmp/patient.cookie "$TRACKING_URL" -o /tmp/called.html
          grep -q "It's your turn" /tmp/called.html

          # Completing service updates both views.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/staff.cookie \
            -d 'queueId=2' --data-urlencode "_csrf=$STAFF_CSRF" http://localhost:8080/complete)" = "302"
          curl -fsS -b /tmp/patient.cookie "$TRACKING_URL" -o /tmp/completed.html
          grep -q 'marked complete' /tmp/completed.html

          # Pause/resume selected department, not every queue.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/staff.cookie \
            -d 'queueId=3&action=pause' --data-urlencode "_csrf=$STAFF_CSRF" http://localhost:8080/togglequeue)" = "302"
          curl -fsS http://localhost:8080/joinqueue -o /tmp/paused.html
          grep -q 'Paused' /tmp/paused.html
          test "$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/staff.cookie \
            -d 'queueId=3&action=resume' --data-urlencode "_csrf=$STAFF_CSRF" http://localhost:8080/togglequeue)" = "302"

          # Even in open showcase mode, a website without CSRF cannot trigger a POST.
          test "$(curl -s -o /dev/null -w '%{http_code}' -d 'queueId=2' \
            http://localhost:8080/callnext)" = "403"

      - name: Print container logs on failure
        if: failure()
        run: docker logs queless-ci || true
